  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

218\">Screen snapshot<\u002Fspan><span style=\"font-size:11px;font-weight:700;color:#562CAD;background:#F5F0FD;border-radius:4px;padding:3px 8px;letter-spacing:.02em\">Authorized only<\u002Fspan><\u002Fdiv>\n            <div style=\"height:120px;border-radius:8px;background:#F0F0F2;background-image:repeating-linear-gradient(135deg,#F0F0F2 0 12px,#E9E9EC 12px 24px);display:flex;align-items:center;justify-content:center\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#5E5E6A;background:#FFFFFF;border:1px solid #E4E4E8;border-radius:4px;padding:5px 8px\">snapshot preview<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- row 3 -->\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));background:#F8F8F9;border:1px solid #F0F0F2;border-radius:28px;overflow:hidden\">\n      <div data-reveal=\"\" style=\"background:radial-gradient(ellipse 80% 70% at 30% 0%,#E9DDFB,#F5F0FD 75%);padding:48px 40px;display:flex;align-items:center;justify-content:center;min-width:0\"><div style=\"width:100%;max-width:460px;display:flex;flex-direction:column;align-items:center\">\n          <div style=\"width:100%;background:#121218;border-radius:16px 16px 4px 4px;padding:12px;box-shadow:0 30px 60px -24px rgba(42,21,86,.45)\">\n            <div style=\"background:#2A1556;border-radius:8px;min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:28px;text-align:center;background-image:radial-gradient(ellipse 70% 60% at 50% 0%,#562CAD,#2A1556 75%)\">\n              <div style=\"width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center\"><span style=\"width:22px;height:22px;flex-shrink:0;background:#FFFFFF;-webkit-mask:url(&quot;bf30de64-8307-46a2-b08c-81f4415d2e98&quot;) center / contain no-repeat;mask:url(&quot;bf30de64-8307-46a2-b08c-81f4415d2e98&quot;) center / contain no-repeat\"><\u002Fspan><\u002Fdiv>\n              <div style=\"font-size:16px;font-weight:700;color:#FFFFFF;letter-spacing:-0.01em\">This device is locked<\u002Fdiv>\n              <div style=\"font-size:12px;line-height:1.5;color:#D0BCF5;max-width:280px\">Property of Euclid City Schools. If found, please contact IT to arrange a return.<\u002Fdiv>\n              <div style=\"display:flex;gap:8px;flex-wrap:wrap;justify-content:center\"><span style=\"font-size:11px;color:#FFFFFF;background:rgba(255,255,255,.12);border-radius:4px;padding:4px 10px\">it@euclid.edu<\u002Fspan><span style=\"font-size:11px;color:#FFFFFF;background:rgba(255,255,255,.12);border-radius:4px;padding:4px 10px\">(216) 555-0142<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"width:112%;height:12px;background:#CACACE;border-radius:0 0 12px 12px\"><\u002Fdiv>\n          <div style=\"margin-top:20px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center\"><span style=\"font-size:12px;font-weight:600;color:#562CAD;background:#F5F0FD;border:1px solid #E9DDFB;border-radius:4px;padding:4px 10px\">Remote lock<\u002Fspan><span style=\"font-size:12px;font-weight:600;color:#3E3E4A;background:#FFFFFF;border:1px solid #E4E4E8;border-radius:4px;padding:4px 10px\">Unlock<\u002Fspan><span style=\"font-size:12px;font-weight:600;color:#3E3E4A;background:#FFFFFF;border:1px solid #E4E4E8;border-radius:4px;padding:4px 10px\">Remote wipe<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv><\u002Fdiv>\n      <div data-reveal=\"\" style=\"padding:64px 56px;display:flex;flex-direction:column;gap:22px;justify-content:center\">\n        <span style=\"display:inline-flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#8248E1\"><span style=\"width:6px;height:6px;border-radius:50%;background:#8248E1\"><\u002Fspan>Remote security<\u002Fspan>\n        <h3 style=\"font-size:clamp(30px,3.2vw,46px);font-weight:800;letter-spacing:-0.04em;line-height:1.02;color:#121218;text-wrap:balance\">Take action wherever the device is<\u002Fh3>\n        <p style=\"font-size:17px;line-height:1.65;color:#5E5E6A;text-wrap:pretty\">Use remote lock to restrict access and display a custom return message, or remotely wipe data when necessary. Once the device is recovered, IT can release the lock so it can be used again. Available actions depend on the device and integration.<\u002Fp>\n        <div style=\"display:flex;gap:12px;flex-wrap:wrap;padding-top:8px\">\n          <x-import component-from-global-scope=\"SenturoDesignSystem_139f60.Button\" variant=\"primary\" size=\"lg\" hint-size=\"150px,48px\">Book a Demo<\u002Fx-import>\n          <x-import component-from-global-scope=\"SenturoDesignSystem_139f60.Button\" variant=\"outline\" size=\"lg\" hint-size=\"150px,48px\">Learn More<\u002Fx-import>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- row 4 -->\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));background:#F8F8F9;border:1px solid #F0F0F2;border-radius:28px;overflow:hidden\">\n      <div data-reveal=\"\" style=\"padding:64px 56px;display:flex;flex-direction:column;gap:22px;justify-content:center\">\n        <span style=\"display:inline-flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#8248E1\"><span style=\"width:6px;height:6px;border-radius:50%;background:#8248E1\"><\u002Fspan>Policies &amp; automation<\u002Fspan>\n        <h3 style=\"font-size:clamp(30px,3.2vw,46px);font-weight:800;letter-spacing:-0.04em;line-height:1.02;color:#121218;text-wrap:balance\">Set the rules and let Senturo respond<\u002Fh3>\n        <p style=\"font-size:17px;line-height:1.65;color:#5E5E6A;text-wrap:pretty\">Trigger actions when a device enters or leaves a defined area, connects to an unapproved network, or misses its check-in deadline. Combine geofencing, network policies, and Agent Phone Home with notifications and security actions on a schedule that fits your organization.<\u002Fp>\n        <div style=\"display:flex;gap:12px;flex-wrap:wrap;padding-top:8px\">\n          <x-import component-from-global-scope=\"SenturoDesignSystem_139f60.Button\" variant=\"primary\" size=\"lg\" hint-size=\"150px,48px\">Book a Demo<\u002Fx-import>\n          <x-import component-from-global-scope=\"SenturoDesignSystem_139f60.Button\" variant=\"outline\" size=\"lg\" hint-size=\"150px,48px\">Learn More<\u002Fx-import>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div data-reveal=\"\" style=\"background:radial-gradient(ellipse 80% 70% at 70% 100%,#E9DDFB,#F5F0FD 75%);padding:48px 40px;display:flex;align-items:center;justify-content:center;min-width:0\"><div style=\"width:100%;max-width:420px\"><div style=\"background:#FFFFFF;border:1px solid #E4E4E8;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 8px 24px -12px rgba(42,21,86,.25);padding:20px\"><div style=\"display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #E4E4E8;padding-bottom:12px\"><span style=\"font-size:14px;font-weight:700;color:#121218\">Off-campus lock<\u002Fspan><span style=\"font-size:11px;font-weight:700;color:#1F8A5B;background:#E6F4EC;border-radius:4px;padding:3px 8px;letter-spacing:.02em\">Active<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:14px;position:relative\"><span style=\"position:absolute;left:15px;top:32px;bottom:32px;width:2px;background:#E9DDFB\"><\u002Fspan>\n            <div style=\"display:grid;grid-template-columns:32px 1fr;gap:12px;align-items:center\"><span style=\"width:32px;height:32px;border-radius:8px;background:#F5F0FD;display:flex;align-items:center;justify-content:center\"><span style=\"width:16px;height:16px;flex-shrink:0;background:#8248E1;-webkit-mask:url(&quot;e12b9c15-5066-458f-ad8c-60c6abfa4f3f&quot;) center / contain no-repe eight:30px;background:#FFFFFF;-webkit-mask:url(&quot;58c0182a-8b4d-4536-90a5-c1023aa02cd0&quot;) center / contain no-repeat;mask:url(&quot;58c0182a-8b4d-4536-90a5-c1023aa02cd0&quot;) center / contain no-repeat\"><\u002Fspan>\n          <span style=\"width:30px;height:30px;background:#FFFFFF;-webkit-mask:url(&quot;06a036d7-9b45-4ab7-91f8-1dcb88e21e9b&quot;) center / contain no-repeat;mask:url(&quot;06a036d7-9b45-4ab7-91f8-1dcb88e21e9b&quot;) center / contain no-repeat\"><\u002Fspan>\n          <span style=\"width:30px;height:30px;background:#FFFFFF;-webkit-mask:url(&quot;619aeb54-ae2d-4087-ae05-adb3fb511073&quot;) center / contain no-repeat;mask:url(&quot;619aeb54-ae2d-4087-ae05-adb3fb511073&quot;) center / contain no-repeat\"><\u002Fspan>\n          <span style=\"width:30px;height:30px;background:#FFFFFF;-webkit-mask:url(&quot;dbad2d85-f146-4a0a-a163-145383046b91&quot;) center / contain no-repeat;mask:url(&quot;dbad2d85-f146-4a0a-a163-145383046b91&quot;) center / contain no-repeat\"><\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"font-size:16px;color:#EDE6FB\">Support: support@senturo.com<br>Mon–Fri, 9 a.m.–6 p.m. EST<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding-top:28px;border-top:1px solid rgba(255,255,255,.16)\">\n      <span style=\"font-size:14px;color:#D0BCF5\">© 2026 Senturo. All rights reserved.<\u002Fspan>\n      <div style=\"display:flex;gap:24px;flex-wrap:wrap\">\n        <a href=\"#\" style-hover=\"color:#FFFFFF\" style=\"font-size:14px;color:#D0BCF5\">Privacy Policy<\u002Fa>\n        <a href=\"#\" style-hover=\"color:#FFFFFF\" style=\"font-size:14px;color:#D0BCF5\">Terms of Service<\u002Fa>\n        <a href=\"#\" style-hover=\"color:#FFFFFF\" style=\"font-size:14px;color:#D0BCF5\">Trust Center<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;defaultTab&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Find &amp; investigate&quot;,&quot;Secure &amp; communicate&quot;,&quot;Automate &amp; document&quot;],&quot;default&quot;:&quot;Find &amp; investigate&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Behavior&quot;}}\">\nclass Component extends DCLogic {\n  componentDidMount() {\n    if (!document.querySelector('script[data-iframe-id=\"gkyz3jzf4r\"]')) { const gs = document.createElement('script'); gs.src = 'https://app.guideflow.com/assets/opt.js'; gs.setAttribute('data-iframe-id', 'gkyz3jzf4r'); document.body.appendChild(gs); }\n    this.onScroll = () => { const s = window.scrollY > 8; if (s !== this.state.scrolled) this.setState({ scrolled: s }); };\n    window.addEventListener('scroll', this.onScroll, { passive: true });\n    this.onScroll();\n    this.setupReveal();\n    this.startGone();\n  }\n  componentDidUpdate() { this.setupReveal(); }\n  componentWillUnmount() { window.removeEventListener('scroll', this.onScroll); if (this.io) this.io.disconnect(); if (this.goneRaf) cancelAnimationFrame(this.goneRaf); }\n  startGone() {\n    const stmts = ['Chasing missing devices', 'Wondering who logged in last', 'Finding out a device went offline too late', 'Checking three systems to locate one laptop', 'Piecing together a recovery report'];\n    const P = 6.2, D = 0.9, C = P + D, FALL = 1.4;\n    const letterFx = [{ dx: -34, r: -28 }, { dx: -10, r: 14 }, { dx: 12, r: -12 }, { dx: 38, r: 26 }];\n    const ease = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;\n    let shownIdx = 0, restoredPass = 0, fadedPass = -1, broken = false, t0 = null;\n    const tick = now => {\n      this.goneRaf = requestAnimationFrame(tick);\n      const path = document.getElementById('stmt-path'), logo = document.getElementById('stmt-logo'), text = document.getElementById('stmt-text');\n      if (!path || !logo || !text) return;\n      const letters = document.querySelectorAll('[data-gone-letter]');\n      if (t0 === null) t0 = now;\n      const t = (now - t0) / 1000, k = Math.floor(t / C), local = t - k * C;\n      const p = Math.min(local / P, 1), e = ease(p), u = k % 2 === 0 ? e : 1 - e;\n      const sec = path.ownerSVGElement.parentElement, W = sec.clientWidth, H = sec.clientHeight, L = path.getTotalLength();\n      const pt = path.getPointAtLength(u * L), pt2 = path.getPointAtLength(Math.min(L, u * L + 4));\n      const sx = W / 1200, sy = H / 400;\n      const ang = Math.atan2((pt2.y - pt.y) * sy, (pt2.x - pt.x) * sx) * 180 / Math.PI * (k % 2 === 0 ? 1 : -1);\n      logo.style.transform = `translate(${pt.x * sx}px,${pt.y * sy}px) rotate(${(ang * 0.35).toFixed(2)}deg)`;\n      // break: time since the logo crossed the centre of this pass\n      const tb = local - P / 2;\n      if (tb >= 0 && tb < FALL + 0.5) {\n        broken = true;\n        const b = Math.min(tb / FALL, 1), crack = tb < 0.18 ? Math.sin(tb * 90) * 1.4 * (1 - tb / 0.18) : 0;\n        letters.forEach((el, i) => {\n          const f = letterFx[i], stag = Math.max(0, Math.min(1, (b - i * 0.06) / 0.82));\n          el.style.transition = 'none'; el.style.filter = 'none';\n          el.style.transform = `translate(${crack + f.dx * stag}px,${crack * 0.6 + 260 * stag * stag}px) rotate(${f.r * stag}deg)`;\n          el.style.opacity = String(1 - Math.max(0, (stag - 0.45) / 0.55));\n        });\n      }\n      // swap statement + restore \"gone\" while the logo rests at the far side\n      // old statement drifts out while the logo is still travelling away from centre\n      if (tb > FALL + 0.9 && fadedPass !== k) {\n        fadedPass = k;\n        text.style.transition = 'opacity .9s cubic-bezier(.4,0,.2,1), transform .9s cubic-bezier(.4,0,.2,1), filter .9s ease';\n        text.style.opacity = '0'; text.style.transform = 'translateY(-8px) scale(.985)'; text.style.filter = 'blur(5px)';\n      }\n      // new statement + \"gone\" gather together while the logo rests at the far side\n      if (local > P + D * 0.15 && restoredPass !== k + 1) {\n        restoredPass = k + 1;\n        const next = (k + 1) % stmts.length;\n        shownIdx = next;\n        text.style.transition = 'none';\n        text.textContent = stmts[next];\n        text.style.transform = 'translateY(16px) scale(.98)'; text.style.filter = 'blur(5px)'; text.style.opacity = '0';\n        letters.forEach((el, i) => {\n          el.style.transition = 'none';\n          const f = letterFx[i];\n          el.style.transform = `translate(${f.dx * 0.5}px,${34 + i * 4}px) rotate(${f.r * 0.35}deg)`;\n          el.style.opacity = '0';\n          el.style.filter = 'blur(3px)';\n        });\n        requestAnimationFrame(() => requestAnimationFrame(() => {\n          text.style.transition = 'opacity 1s cubic-bezier(.2,.7,.2,1), transform 1.1s cubic-bezier(.2,.7,.2,1), filter 1s ease';\n          text.style.opacity = '1'; text.style.transform = 'none'; text.style.filter = 'none';\n          letters.forEach((el, i) => {\n            const d = 260 + i * 70;\n            el.style.transition = `opacity .8s ease ${d}ms, transform 1s cubic-bezier(.2,.8,.2,1) ${d}ms, filter .8s ease ${d}ms`;\n            el.style.transform = 'none'; el.style.opacity = '1'; el.style.filter = 'none';\n          });\n        }));\n        broken = false;\n      }\n    };\n    this.goneRaf = requestAnimationFrame(tick);\n  }\n  setupReveal() {\n    if (!('IntersectionObserver' in window)) return;\n    if (!this.io) this.io = new IntersectionObserver(es => { es.forEach(e => { if (e.isIntersecting) { const el = e.target; el.style.opacity = '1'; el.style.transform = 'none'; el.setAttribute('data-revealed', '1'); this.io.unobserve(el); } }); }, { threshold: 0.12, rootMargin: '0px 0px -6% 0px' });\n    document.querySelectorAll('[data-reveal]:not([data-revealed])').forEach(el => {\n      const r = el.getBoundingClientRect();\n      if (r.top < window.innerHeight * 0.92) { el.setAttribute('data-revealed', '1'); return; }\n      const t = el.style.transition || '';\n      el.style.transition = (t ? t + ',' : '') + 'opacity .8s cubic-bezier(.2,.7,.2,1)' + (t.includes('transform') ? '' : ',transform .8s cubic-bezier(.2,.7,.2,1)');\n      el.style.opacity = '0'; el.style.transform = 'translateY(28px)';\n      el.setAttribute('data-revealed', 'pending');\n      this.io.observe(el);\n    });\n  }\n  state = { tab: null, cat: 0, open: {}, scrolled: false };\n  icon(name, color, size) {\n    const u = `url(https://unpkg.com/lucide-static@0.460.0/icons/${name}.svg) center / contain no-repeat`;\n    return React.createElement('span', { style: { display: 'inline-block', width: size, height: size, background: color, WebkitMask: u, mask: u } });\n  }\n  renderVals() {\n    const { cat, open } = this.state;\n    const tabNames = ['Find & investigate', 'Secure & communicate', 'Automate & document'];\n    const tab = this.state.tab ?? Math.max(0, tabNames.indexOf(this.props.defaultTab ?? 'Find & investigate'));\n    const on = '#F5F0FD', off = '#FFFFFF';\n    const cats = [\"General\",\"Device Tracking & Recovery\",\"Remote Actions & Messaging\",\"Policies & Automation\",\"Setup & Integrations\",\"Customer Support\",\"Data Security & Privacy\"];\n    const faq = [[[\"What is Senturo?\",\"Senturo helps IT teams locate, secure, and recover company or school devices. It brings device tracking, location history, remote actions, and security automations into one platform.\"],[\"Who is Senturo for?\",\"Senturo is built for organizations managing mobile devices, including schools, businesses, healthcare providers, retailers, and field teams.\"],[\"Which devices and operating systems does Senturo support?\",\"Senturo supports Windows, macOS, ChromeOS, iOS, iPadOS, and Android. Available tracking features and security actions vary by platform.\"],[\"How is Senturo different from an MDM?\",\"An MDM handles tasks such as app deployment, device configuration, and operating-system policies. Senturo adds location visibility, recovery tools, and security automations alongside it.\"],[\"Can I use Senturo without an MDM?\",\"Yes, you can enroll devices directly in Senturo. Connecting an MDM can simplify deployment and provide additional device actions.\"],[\"Can I manage devices across multiple locations?\",\"Yes, you can view devices across locations in one dashboard and organize them into groups by office, school, department, or device type.\"]],[[\"How does Senturo locate devices?\",\"Senturo uses available location signals, including nearby Wi-Fi networks and device location services, to estimate a device’s position. Accuracy depends on the device, permissions, and surrounding signals.\"],[\"How often is a device’s location updated?\",\"Senturo documents standard check-ins every 10 minutes and updates every 60 seconds in Missing Mode. Reporting depends on connectivity and the device’s configuration.\"],[\"Can Senturo locate an offline device?\",\"You can review its last reported location and recorded history. A device that is powered off or fully disconnected cannot send a new location until it reconnects.\"],[\"What is Missing Mode, and when should I activate it?\",\"Activate Missing Mode when a device is lost or suspected stolen. It increases tracking frequency and enables recovery features, including screenshots on supported devices.\"],[\"Can I view a device’s location history?\",\"Yes, you can review previously reported locations and timestamps, subject to your account’s retention policy and privacy settings.\"],[\"Can I see who last logged in?\",\"Yes, Senturo provides last logged-in user information where supported. This helps identify the most recent account used on the device, which may differ from its assigned owner.\"],[\"Which devices support screenshots in Missing Mode?\",\"Senturo’s current automation documentation lists Windows, macOS, and ChromeOS. Screenshots are not supported on iOS, iPadOS, or Android, and require the relevant permissions and settings.\"],[\"Can I export a PDF recovery report?\",\"Yes, Senturo can generate a PDF recovery report to share relevant device information during an investigation or recovery.\"]],[[\"Which devices can I remotely lock or wipe?\",\"Senturo Lock supports Windows, macOS, and ChromeOS, while Senturo Wipe supports Windows and macOS. Connected MDMs provide additional actions depending on the platform and enrollment.\"],[\"Can I add return instructions to a locked device?\",\"Yes, Senturo Lock lets you display a custom message, contact details, and an optional image to help someone return the device. Mark the device as missing before applying Senturo Lock.\"],[\"Can Senturo continue tracking a locked device?\",\"Yes, Senturo Lock is designed to keep tracking active while restricting access. The device still needs connectivity and the required permissions to report its location. MDM locks can behave differently.\"],[\"Can I unlock a device after it’s recovered?\",\"Yes, an authorized administrator can release a Senturo lock remotely once the device can receive the command.\"],[\"What happens if I send a command while a device is offline?\",\"Remote commands generally wait until the device reconnects. The exact behavior depends on the action and whether it is handled by Senturo or a connected MDM.\"],[\"What does remote wipe delete?\",\"Senturo Wipe for Windows and macOS removes personal data while preserving the Senturo agent for continued tracking. MDM wipe commands can behave differently, so review the selected action before confirming it.\"],[\"Can I send a message to one device or my whole fleet?\",\"Yes, broadcasts let you send messages to individual devices, selected groups, or your fleet. You can also save templates for recurring messages.\"],[\"Can I take action on multiple devices at once?\",\"Yes, select devices and use bulk actions to send messages or apply supported security commands.\"]],[[\"Which device events can trigger an automation?\",\"Triggers include entering or leaving a geofence, connecting through an unapproved network, and exceeding a check-in deadline. You choose the devices, actions, and schedule for each automation.\"],[\"How do geofencing alerts and actions work?\",\"Create a geographic boundary and choose what happens when a device reports a location inside or outside it. Responses can include notifying IT or running supported security actions.\"],[\"What is Agent Phone Home?\",\"Agent Phone Home checks how long a device has gone without contacting Senturo. You set the allowed period and connect the policy to an action such as Senturo Lock.\"],[\"Can I trigger an action when a device stops checking in?\",\"Yes, create an Agent Phone Home policy with a check-in deadline, select the device groups, and configure the response. Different groups can have different deadlines.\"],[\"Can I detect devices using unapproved networks?\",\"Yes, IP fencing lets you define approved network ranges and trigger an automation when a device reports a connection outside them.\"],[\"Can I automatically activate Missing Mode or lock a device?\",\"Yes, both are available as automation actions on supported devices. An automation can run multiple actions in order, such as activating Missing Mode, locking the device, and notifying IT.\"],[\"Can I schedule policies or pause them during holidays?\",\"Yes, automations support schedules and exclusions so you can control when they run, including exceptions for holidays or weekends.\"],[\"Can different device groups have different policies?\",\"Yes, assign automations to specific groups to apply different rules across schools, departments, locations, or device types.\"]],[[\"How do I enroll devices in Senturo?\",\"Choose the operating system in Device Enrollment and follow the instructions to install the Senturo agent, app, or extension. You can enroll devices individually or use the available bulk deployment options.\"],[\"Which MDM platforms does Senturo integrate with?\",\"Senturo integrates with Google Admin Console, Jamf Pro, Microsoft Intune, and Cisco Meraki. It also connects with Incident IQ for asset-based recovery workflows.\"],[\"How does Senturo work with Incident IQ?\",\"Senturo adds links to Incident IQ asset records that open the device’s Senturo console. Authorized staff can view locations and users, change device status, and access supported recovery actions.\"],[\"Can I deploy Senturo across my fleet through my MDM?\",\"Yes, supported deployment methods let you distribute the Senturo app, agent, or extension through your MDM. Some operating-system permissions still require approval on the device.\"],[\"Can I connect more than one MDM?\",\"Yes, Senturo supports multiple MDM integrations at the same time, allowing you to view devices from different systems in one dashboard.\"],[\"Can I organize devices by school, department, or location?\",\"Yes, use groups, tags, notes, and saved filters to organize your fleet and find specific devices.\"],[\"Can I assign staff access to specific device groups?\",\"Yes, group-based access and role permissions let you limit which devices staff can manage and which actions they can perform.\"]],[[\"How do I contact Senturo support?\",\"Email support@senturo.com or create and manage tickets through the Senturo support portal.\"],[\"What support is included with my subscription?\",\"Senturo lists standard support hours as Monday through Friday, 9 a.m. to 6 p.m. EST. Out-of-hours support is available through Priority Support; check your agreement for your account’s coverage.\"],[\"Can your team help with setup and deployment?\",\"Contact Senturo support with your device types, MDM, and rollout requirements to arrange the appropriate setup assistance.\"],[\"Do you offer training for IT teams?\",\"Contact your Senturo account manager or support team to confirm the training options available for your organization.\"],[\"Where can I find setup guides and troubleshooting instructions?\",\"Visit the Senturo Knowledge Base for enrollment guides, integration instructions, feature documentation, and troubleshooting.\"]],[[\"What device and user information does Senturo collect?\",\"Depending on your platform and settings, Senturo can collect device identifiers, location history, check-in times, network details, last logged-in user information, and recovery screenshots.\"],[\"Who can view device locations and take security actions?\",\"Access depends on the roles, permissions, and privacy settings configured for your organization. You can restrict sensitive information and actions to authorized staff.\"],[\"Can location information stay hidden until a device is reported missing?\",\"Yes, Privacy-First Geotracking can hide location information until Missing Mode is activated. Another option requires approval from a second administrator before location data becomes visible. Contact Senturo to configure your preferred level.\"],[\"Can I disable screenshots or other privacy-sensitive features?\",\"Yes, Senturo provides controls for disabling unwanted tracking features. You can also request that a tracking data type be disabled across your account.\"],[\"Does Senturo keep a record of administrator activity?\",\"Yes, Senturo maintains action history and audit logs to help your team review activity and investigate changes.\"],[\"Where is device data stored, and how is it protected?\",\"Senturo hosts its platform on Microsoft Azure in the United States. Its published controls include encryption at rest and in transit, authentication, and access restrictions.\"],[\"How long does Senturo retain location history and other records?\",\"Retention depends on the data type and your account’s policy. Contact Senturo to confirm the periods that apply to your organization or discuss a custom retention arrangement.\"],[\"What security certifications and documentation are available?\",\"Senturo’s security page lists SOC 2 Type I. Visit the Senturo Trust Center to review available information and request security documentation.\"],[\"How can schools configure Senturo to support their privacy requirements?\",\"Schools can restrict access by role, hide location information during normal use, require additional approval, and disable sensitive features. These controls should be configured around the district’s policies for device recovery and data access.\"]]];\n    return {\n      navShadow: this.state.scrolled ? '0 20px 40px -16px rgba(18,18,24,.22)' : '0 1px 3px rgba(18,18,24,.06)',\n      navBorder: this.state.scrolled ? 'rgba(18,18,24,.08)' : 'rgba(18,18,24,.05)',\n      arrowWhite: this.icon('arrow-right', '#FFFFFF', 14),\n      arrowPurple: this.icon('arrow-right', '#8248E1', 14),\n      tab0: () => this.setState({ tab: 0 }), tab1: () => this.setState({ tab: 1 }), tab2: () => this.setState({ tab: 2 }),\n      isTab0: tab === 0, isTab1: tab === 1, isTab2: tab === 2,\n      tabBg0: tab === 0 ? '#FFFFFF' : 'transparent', tabBg1: tab === 1 ? '#FFFFFF' : 'transparent', tabBg2: tab === 2 ? '#FFFFFF' : 'transparent',\n      tabColor0: tab === 0 ? '#121218' : '#5E5E6A', tabColor1: tab === 1 ? '#121218' : '#5E5E6A', tabColor2: tab === 2 ? '#121218' : '#5E5E6A',\n      tabShadow0: tab === 0 ? '0 1px 3px rgba(18,18,24,.12)' : 'none', tabShadow1: tab === 1 ? '0 1px 3px rgba(18,18,24,.12)' : 'none', tabShadow2: tab === 2 ? '0 1px 3px rgba(18,18,24,.12)' : 'none',\n      integrations: ['Salesforce', 'HubSpot', 'Zoho', 'Dynamics', 'Pardot', 'Pipedrive', 'monday', 'Marketo', 'Zapier', 'Outreach', 'Slack', 'Outlook', 'Azure', 'Google', 'Nimble', 'Workday', 'Eloqua', 'Freshsales'],\n      faqCats: cats.map((name, i) => ({ name, bg: i === cat ? on : 'transparent', color: i === cat ? '#562CAD' : '#5E5E6A', select: () => this.setState({ cat: i, open: {} }) })),\n      activeCatName: cats[cat],\n      faqItems: faq[cat].map(([q, a], i) => {\n        const isOpen = !!open[i];\n        return { q, a, open: isOpen, icon: `https://unpkg.com/lucide-static@0.4
